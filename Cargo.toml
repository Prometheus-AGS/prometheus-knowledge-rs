[workspace]
members = [
    "pk-core",
    "pk-store",
    "pk-watcher",
    "pk-librarian",
    "pk-mcp",
    "pk-uar",
    "pk-cherry",
    "pk-event-store",
    "pk-cli",
    "pk-learning-worker",
]
resolver = "2"

[workspace.package]
version = "1.7.0"
edition = "2021"
authors = ["Travis James <travis@prometheusags.com>"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tower = { version = "0.5" }
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Errors
anyhow = "1"
thiserror = "2"

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Domain
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Markdown & frontmatter
pulldown-cmark = "0.12"

# File watching
notify = { version = "8.2", features = ["macos_fsevent"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging / tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Allocator (applied at binary entry points only)
tikv-jemallocator = { version = "0.6", optional = false }

# Async trait objects
async-trait = "0.1"

# Cryptography
sha2 = "0.10"

# Platform directories
dirs = "5"
fs2 = "0.4"

# Internal crates
pk-core        = { version = "1.7.0", path = "pk-core" }
pk-store       = { version = "1.7.0", path = "pk-store" }
pk-watcher     = { version = "1.7.0", path = "pk-watcher" }
pk-librarian   = { version = "1.7.0", path = "pk-librarian" }
pk-mcp         = { version = "1.7.0", path = "pk-mcp" }
pk-event-store = { version = "1.7.0", path = "pk-event-store" }
