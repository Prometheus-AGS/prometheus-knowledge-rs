[package]
name = "pk-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "pk"
path = "src/main.rs"

[dependencies]
pk-core        = { workspace = true }
pk-store       = { workspace = true }
pk-librarian   = { workspace = true }
pk-watcher     = { workspace = true }
pk-event-store = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
clap         = { workspace = true }
tracing      = { workspace = true }
tracing-subscriber = { workspace = true }
sha2         = { workspace = true }
dirs         = { workspace = true }

[dev-dependencies]
tempfile = "3"

# jemalloc does not build for MSVC: its autoconf configure step cannot produce a working
# compiler there. main.rs already gates the allocator on cfg(not(target_env = "msvc")); the
# dependency has to carry the same condition, or Cargo still compiles tikv-jemalloc-sys on
# Windows and the build script fails before any of our code is reached.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { workspace = true }
